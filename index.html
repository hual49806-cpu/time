<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1711">
  <title>時光修復局｜國語版 V2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="home" class="screen active home">
    <div class="home-panel">
      <h1>時光修復局</h1>
      <p>國語版 V2</p>
      <h2>第一章：幸福筆記本失竊事件</h2>
      <p class="intro">完成四道修復關卡，奪回被破壞的文字與記憶。</p>
      <button id="newGame" class="main-btn">開始新遊戲</button>
      <button id="continueGame" class="sub-btn hidden">繼續遊戲</button>
      <button id="resetGame" class="danger-btn">重置進度</button>
    </div>
  </section>

  <section id="select" class="screen select">
    <div class="panel">
      <h2>選擇時光修復員</h2>
      <div class="char-grid">
        <button class="char-card" data-char="female">
          <img src="assets/characters/female_idle.webp" alt="女修復員">
          <span>女修復員</span>
        </button>
        <button class="char-card" data-char="male">
          <img src="assets/characters/male_idle.webp" alt="男修復員">
          <span>男修復員</span>
        </button>
      </div>
      <button id="backHome" class="sub-btn">返回首頁</button>
    </div>
  </section>

  <section id="map" class="screen map">
    <header class="topbar">
      <div class="logo">時光修復局<br><small>國語版 V2</small></div>
      <div>修復進度 <b id="mapProgress">0%</b></div>
      <div>金幣 <b id="mapCoins">120</b></div>
      <div>時光碎片 <b id="mapShards">35</b></div>
    </header>
    <main class="map-wrap">
      <h2>第一章：幸福筆記本失竊事件</h2>
      <div id="levelCards" class="level-grid"></div>
      <button id="mapHome" class="sub-btn">返回首頁</button>
    </main>
  </section>

  <section id="battle" class="screen battle">
    <div id="battleBg" class="battle-bg"></div>
    <header class="battle-top">
      <div><b id="levelName">第一關</b></div>
      <div>修復 <b id="repair">0%</b></div>
      <div>金幣 <b id="coins">0</b></div>
      <div>碎片 <b id="shards">0</b></div>
      <div>生命 <b id="lives">❤❤❤❤</b></div>
      <button id="pause">Ⅱ</button>
    </header>

    <div class="boss-hud">
      <span>BOSS HP</span>
      <div class="boss-bar"><i id="bossHp"></i></div>
      <b id="bossHpText">100/100</b>
    </div>

    <div class="battle-stage">
      <div id="comboBadge" class="combo-badge hidden"></div>
      <img id="bossImg" class="boss-img" alt="Boss">
      <img id="heroImg" class="hero-img" alt="主角">
    </div>

    <div class="question-box">
      <div class="question-head">
        <span id="qCategory">分類</span>
        <span id="qCount">1/10</span>
      </div>
      <h2 id="qText">題目載入中</h2>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback" aria-live="polite"></div>
      <div class="question-actions">
        <button id="hint" class="hint-btn">提示 × <span id="hintCount">3</span></button>
        <button id="next" class="main-btn hidden">下一題</button>
      </div>
    </div>
  </section>

  <section id="result" class="screen result">
    <div class="result-card">
      <h1 id="resultTitle">修復成功！</h1>
      <img id="resultArt" class="result-art" alt="結果圖">
      <p id="resultMsg"></p>
      <div class="result-stats">
        <span>答對 <b id="rCorrect">0/10</b></span>
        <span>正確率 <b id="rRate">0%</b></span>
        <span>最高連擊 <b id="rCombo">0</b></span>
      </div>
      <div class="result-buttons">
        <button id="retry" class="main-btn">重新挑戰</button>
        <button id="toMap" class="sub-btn">返回章節</button>
        <button id="nextLevel" class="main-btn">前往下一關</button>
      </div>
    </div>
  </section>

  <section id="victory" class="screen victory">
    <div class="victory-card">
      <h1>恭喜通關！</h1>
      <p>你成功修復了破損的時間，守護了珍貴的記憶。</p>
      <div class="final-stats">
        <span>累計答對 <b id="finalCorrect">0/40</b></span>
        <span>金幣 <b id="finalCoins">0</b></span>
        <span>時光碎片 <b id="finalShards">0</b></span>
      </div>
      <button id="again" class="main-btn">重新開始冒險</button>
      <button id="victoryMap" class="sub-btn">返回章節地圖</button>
    </div>
  </section>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h2 id="modalTitle">任務暫停</h2>
      <p id="modalText">稍作休息，再繼續修復。</p>
      <button id="modalPrimary" class="main-btn">繼續</button>
      <button id="modalSecondary" class="sub-btn">返回章節</button>
    </div>
  </div>
</div>
<script src="data/questions.js"></script>
<script src="game.js"></script>
</body>
</html>
