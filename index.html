<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171023">
<title>時光修復局｜國語版</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="home" class="screen active home">
    <div class="homeShade"></div>
    <div class="homePanel parchment">
      <p class="eyebrow">逆舟家教專屬</p>
      <h1>時光修復局</h1>
      <h2>國語版｜第一課〈幸福筆記本〉</h2>
      <p>完成四個時光區域，每關隨機抽取 10 題，修復散落的文字與記憶。</p>
      <div class="homeBtns">
        <button id="newGame" class="btn primary">開始冒險</button>
        <button id="continueGame" class="btn secondary hidden">繼續遊戲</button>
      </div>
    </div>
  </section>

  <section id="select" class="screen select">
    <div class="selectPanel parchment">
      <h2>選擇時光修復員</h2>
      <p>角色只影響畫面，不影響題目與獎勵。</p>
      <div class="choices">
        <button class="charCard" data-char="female">
          <img src="assets/characters/female_idle.webp" alt="女修復員">
          <strong>女修復員</strong>
        </button>
        <button class="charCard" data-char="male">
          <img src="assets/characters/male_idle.webp" alt="男修復員">
          <strong>男修復員</strong>
        </button>
      </div>
      <button id="backHome" class="btn ghost">返回</button>
    </div>
  </section>

  <section id="map" class="screen map">
    <header class="topbar">
      <div class="logo">時光修復局<small>國語版</small></div>
      <div>修復進度 <b id="mapProgress">0%</b></div>
      <div>🪙 <b id="mapCoins">120</b></div>
      <div>💎 <b id="mapShards">35</b></div>
      <button id="resetGame" class="gear">↻</button>
    </header>
    <div class="mapPanel parchment">
      <h2>第一章：幸福筆記本失竊事件</h2>
      <div id="levelCards" class="levelCards"></div>
    </div>
  </section>

  <section id="battle" class="screen battle">
    <div id="battleBg" class="battleBg"></div>
    <header class="topbar battleTop">
      <div class="logo">時光修復局<small id="levelName">第一關</small></div>
      <div>修復進度 <b id="repair">0%</b></div>
      <div>🪙 <b id="coins">120</b></div>
      <div>💎 <b id="shards">35</b></div>
      <div>生命 <b id="lives">❤❤❤❤</b></div>
      <button id="pause" class="gear">Ⅱ</button>
    </header>

    <div class="arena">
      <div class="bossBox">
        <div class="hpWrap"><span>BOSS HP</span><div class="hp"><i id="bossHp"></i></div><b id="bossHpText">100/100</b></div>
        <img id="bossImg" src="" alt="Boss">
      </div>
      <div class="heroBox">
        <img id="heroImg" src="" alt="時光修復員">
      </div>
    </div>

    <div class="question parchment">
      <div class="qmeta"><span id="qCategory">生字詞</span><b id="qCount">1/10</b></div>
      <h2 id="qText">題目載入中</h2>
      <div id="options" class="options"></div>
      <p id="feedback" class="feedback"></p>
      <div class="qActions">
        <button id="hint" class="btn ghost">💡 提示（<span id="hintCount">3</span>）</button>
        <button id="next" class="btn primary hidden">下一題</button>
      </div>
    </div>
  </section>

  <section id="result" class="screen result">
    <div class="resultPanel parchment">
      <h1 id="resultTitle">挑戰成功</h1>
      <img id="resultArt" src="" alt="結果畫面">
      <div class="stats">
        <div><span>答對</span><b id="rCorrect">0/10</b></div>
        <div><span>正確率</span><b id="rRate">0%</b></div>
        <div><span>最高連擊</span><b id="rCombo">0</b></div>
      </div>
      <p id="resultMsg"></p>
      <div class="resultBtns">
        <button id="retry" class="btn secondary">重新挑戰</button>
        <button id="toMap" class="btn ghost">返回章節</button>
        <button id="nextLevel" class="btn primary">前往下一關</button>
      </div>
    </div>
  </section>

  <section id="victory" class="screen victory">
    <div class="victoryOverlay"></div>
    <div class="victoryCard parchment">
      <h1>恭喜通關！</h1>
      <p>你成功修復了破損的時間，守護了時光與珍貴的回憶。</p>
      <div class="stats finalStats">
        <div><span>總答對</span><b id="finalCorrect">0/40</b></div>
        <div><span>金幣</span><b id="finalCoins">0</b></div>
        <div><span>時光碎片</span><b id="finalShards">0</b></div>
      </div>
      <button id="again" class="btn secondary">重新挑戰全部</button>
      <button id="victoryMap" class="btn primary">返回章節</button>
    </div>
  </section>

  <div id="modal" class="modal hidden">
    <div class="modalBox parchment">
      <h2 id="modalTitle">暫停</h2>
      <p id="modalText">是否繼續挑戰？</p>
      <div class="modalBtns">
        <button id="modalPrimary" class="btn primary">繼續</button>
        <button id="modalSecondary" class="btn ghost">返回章節</button>
      </div>
    </div>
  </div>
</div>
<script src="data/questions.js"></script>
<script src="game.js"></script>
</body>
</html>
